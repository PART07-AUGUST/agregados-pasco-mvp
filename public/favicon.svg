<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Fondo distintivo squircle dark slate con borde ámbar -->
  <rect width="64" height="64" rx="16" fill="#0B1120"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="2"/>
  
  <!-- Montañas andinas estilizadas de fondo -->
  <path d="M10 41L22 24L32 37L43 21L54 41H10Z" fill="#1E293B" opacity="0.65"/>
  <path d="M22 24L25.5 28.5L28.5 26.5L32 37L22 24Z" fill="#334155" opacity="0.5"/>
  <path d="M43 21L46.5 26L49.5 23.5L54 41H39L43 21Z" fill="#334155" opacity="0.5"/>
  
  <!-- Carga de agregados y piedra en tolva -->
  <path d="M16 32C17.5 28.5 21 28 23.5 29C26 27.5 30.5 27.5 32.5 29.5C34.5 28.5 37.5 29 38.5 32H16Z" fill="url(#amber-stones)"/>
  
  <!-- Tolva de volquete minero -->
  <path d="M14 33H39L35.5 43.5H17.5L14 33Z" fill="url(#amber-truck)"/>
  <path d="M14 33L17.5 43.5H35.5L39 33" stroke="#FDE68A" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Cabina del volquete -->
  <path d="M39 34.5H46.5L49.5 39V43.5H39V34.5Z" fill="url(#amber-truck)"/>
  <path d="M41 36H45.5L47.5 39H41V36Z" fill="#0B1120"/>
  
  <!-- Chasis -->
  <rect x="13.5" y="43.5" width="37" height="2.5" rx="1.2" fill="#475569"/>
  
  <!-- Rueda delantera -->
  <circle cx="45" cy="46.5" r="4.5" fill="#020617" stroke="#CBD5E1" stroke-width="1.8"/>
  <circle cx="45" cy="46.5" r="1.8" fill="#F59E0B"/>
  
  <!-- Ruedas traseras en tándem -->
  <circle cx="21" cy="46.5" r="4.5" fill="#020617" stroke="#CBD5E1" stroke-width="1.8"/>
  <circle cx="21" cy="46.5" r="1.8" fill="#F59E0B"/>
  <circle cx="30" cy="46.5" r="4.5" fill="#020617" stroke="#CBD5E1" stroke-width="1.8"/>
  <circle cx="30" cy="46.5" r="1.8" fill="#F59E0B"/>

  <!-- Gradientes industriales -->
  <defs>
    <linearGradient id="amber-truck" x1="14" y1="33" x2="49.5" y2="43.5" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="amber-stones" x1="16" y1="28" x2="38.5" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FEF08A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
</svg>
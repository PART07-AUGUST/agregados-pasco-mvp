name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'enhancement/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

# Cancelar ejecuciones concurrentes en la misma rama para optimizar minutos de GitHub Actions
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm & Node.js
        uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@22
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint static analysis
        run: pnpm run lint

      - name: Verify TypeScript & Build bundle
        run: pnpm run build
        env:
          VITE_SUPABASE_URL: https://ci-mock.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-mock-anon-key
          VITE_GOOGLE_MAPS_API_KEY: ci-mock-maps-key
          VITE_GRAPHHOPPER_API_KEY: ci-mock-graphhopper-key

name: ML Continuous Retraining Pipeline

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

concurrency:
  group: ml-retraining
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  retrain:
    name: Retrain & Deploy ML Model
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: ml-production
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          version: "0.13.4"
          python-version: "3.12"

      - name: Validate model comparison and publication rules
        run: uv run --locked python -m unittest discover -s scripts -p "test_*.py"

      - name: Run automated retraining with uv
        run: uv run --locked python scripts/retrain_ml.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ML_ARTIFACT_HMAC_KEY: ${{ secrets.ML_ARTIFACT_HMAC_KEY }}

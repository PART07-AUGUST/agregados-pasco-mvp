services:
  openplc:
    image: ghcr.io/autonomy-logic/openplc-runtime:v4.3.1
    container_name: agregados-openplc-demo
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:1502:1502"
    volumes:
      - openplc-runtime-data:/var/run/runtime

volumes:
  openplc-runtime-data:
